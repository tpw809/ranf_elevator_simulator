<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="200" height="100" fill="none"/>

  <!-- Concentric arcs -->
  <path d="M10,100 A90,90 0 0,1 190,100" stroke="#000000" stroke-width="20" fill="none"/>
  <path d="M30,100 A70,70 0 0,1 170,100" stroke="#FFFFFF" stroke-width="20" fill="none"/>
  <path d="M50,100 A50,50 0 0,1 150,100" stroke="#000000" stroke-width="20" fill="none"/>
  <path d="M70,100 A30,30 0 0,1 130,100" stroke="#FFFFFF" stroke-width="20" fill="none"/>

  <!-- Center full circle -->
  <circle cx="100" cy="100" r="20" fill="#000000"/>

</svg>